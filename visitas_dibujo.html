<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitas y Proyectos Arquitectónicos | Avalúos</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { leezar: { 500: '#0d9488', 600: '#0f766e' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="js/layout.js"></script> 

    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { @apply text-indigo-600 border-b-2 border-indigo-600; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen relative">

    <div id="security-loader" class="fixed inset-0 z-[9999] bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl shadow-lg flex items-center justify-center mb-4 border border-slate-200 dark:border-slate-700">
            <span class="material-symbols-rounded animate-spin text-4xl text-indigo-500">lock_open</span>
        </div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest animate-pulse">Verificando Accesos...</p>
    </div>

    <main id="main-content" class="max-w-md mx-auto pb-24" style="visibility: hidden;">
        <header class="p-6">
            <h1 class="text-3xl font-black text-slate-800 dark:text-white mb-1">Mis Tareas</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Gestión de levantamientos y planos</p>
        </header>

        <div class="px-6 mb-6">
            <div class="flex border-b border-slate-200 dark:border-slate-800">
                <button onclick="switchTab('visitas')" id="tab-visitas" class="flex-1 pb-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition-all">
                    VISITAS (Fotos)
                </button>
                <button onclick="switchTab('dibujos')" id="tab-dibujos" class="flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all">
                    DIBUJO (Proyecto Arquitectónico)
                </button>
            </div>
        </div>

        <div class="px-6 mb-6">
            <div class="relative">
                <span class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                <input type="text" id="busqueda" oninput="filtrarTareas()" placeholder="Buscar cliente o folio..." 
                    class="w-full pl-12 pr-4 py-4 bg-white dark:bg-slate-900 border-none rounded-2xl shadow-sm text-sm font-medium focus:ring-2 focus:ring-indigo-500 dark:text-white transition-all">
            </div>
        </div>

        <div id="contenedor-tareas" class="px-6 space-y-4">
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <span class="material-symbols-rounded text-5xl animate-spin mb-4">sync</span>
                <p class="text-xs font-bold uppercase tracking-widest">Cargando tareas...</p>
            </div>
        </div>
    </main>

    <div id="modal-upload" class="fixed inset-0 z-[100] hidden bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl border border-slate-200 dark:border-slate-700">
            <span class="material-symbols-rounded animate-spin text-6xl text-indigo-500 mb-4 block">cloud_sync</span>
            <h3 class="text-xl font-black text-slate-800 dark:text-white mb-2" id="upload-title">Subiendo Archivos...</h3>
            <p class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-6" id="upload-status">Preparando archivos...</p>
            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-3 overflow-hidden shadow-inner">
                <div id="upload-progress" class="bg-indigo-500 h-full transition-all duration-300 relative" style="width: 0%">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-4 font-medium" id="upload-warning">Por favor, no cierres esta pantalla.</p>
        </div>
    </div>

    <input type="file" id="input-visita" accept="image/*" multiple class="hidden" onchange="procesarArchivos(event, 'VISITA')">
    <input type="file" id="input-dibujo" accept=".pdf,.dwg,.dxf" multiple class="hidden" onchange="procesarArchivos(event, 'DIBUJO')">

    <script>
        const db = firebase.firestore();
        let misExpedientes = [];
        let vistaActual = 'visitas';
        
        // 🔥 TU URL DE GOOGLE APPS SCRIPT
        const SCRIPT_SUBIDA_URL = 'https://script.google.com/macros/s/AKfycbw8FRLtEIxNMw0eGmMlwm66ZIyLkgU0eCjq-k7-TFR7lOHH1bDgt-jOALnH5LyH681-9w/exec'; 

        async function iniciarMotorBusqueda() {
            const userJson = localStorage.getItem('leezar_user_active');
            if(!userJson) return;
            const user = JSON.parse(userJson);

            db.collection('expedientes_avaluos')
                .where('estatus', 'in', ['VISITA PROGRAMADA', 'EN DIBUJO', 'PENDIENTE', 'EN REVISIÓN'])
                .onSnapshot(snapshot => {
                    misExpedientes = snapshot.docs.map(doc => {
                        const data = doc.data();
                        let coords = data.coordenadas || null;
                        if (!coords && data.checklist && data.checklist.UBICACION_MAPS) coords = data.checklist.UBICACION_MAPS.coordenadas || null;

                        let dir = data.ubicacion || data.direccion || data.municipio;
                        if ((!dir || dir === 'Sin dirección') && data.checklist && data.checklist.UBICACION_MAPS) dir = data.checklist.UBICACION_MAPS.direccion || data.checklist.UBICACION_MAPS.ubicacion || data.checklist.UBICACION_MAPS.address;
                        if (!dir || dir === 'Sin dirección' || dir === 'Dirección no registrada') dir = coords ? `📍 Ubicación por GPS guardada` : 'Dirección no registrada';

                        return { id: doc.id, ...data, direccion_limpia: dir, coordenadas_limpias: coords };
                    })
                    .filter(exp => {
                        if(vistaActual === 'visitas') return exp.visitador === user.email || exp.visitador_asignado === user.email;
                        return exp.dibujante === user.email || exp.dibujante_asignado === user.email;
                    });

                    renderizarTareas();

                    document.getElementById('main-content').style.visibility = 'visible';
                    const secLoader = document.getElementById('security-loader');
                    if (secLoader && !secLoader.classList.contains('opacity-0')) {
                        secLoader.classList.add('opacity-0', 'pointer-events-none');
                        setTimeout(() => secLoader.remove(), 400);
                    }
                });
        }

        function renderizarTareas() {
            const container = document.getElementById('contenedor-tareas');
            container.innerHTML = '';

            if(misExpedientes.length === 0) {
                container.innerHTML = `<div class="text-center py-20"><div class="w-20 h-20 bg-slate-100 dark:bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-4"><span class="material-symbols-rounded text-slate-400 text-4xl">bedtime</span></div><p class="text-slate-500 dark:text-slate-400 text-sm font-bold">No tienes tareas pendientes por ahora.</p></div>`;
                return;
            }

            misExpedientes.forEach(exp => {
                const colorBase = vistaActual === 'visitas' ? 'indigo' : 'orange';
                const icon = vistaActual === 'visitas' ? 'photo_camera' : 'architecture';
                let coordsFinales = exp.coordenadas_limpias;
                let direccionFinal = exp.direccion_limpia;
                // Se usa la URL estándar de Google Maps para coordenadas
                let linkGoogleMaps=coordsFinales?`https://www.google.com/maps?q=${coordsFinales.replace(/\s/g,'')}`:'#'; 
                

                // 🔥 UX NUEVA: Detectar si ya hay archivos subidos para cambiar el botón
                let prevFiles = 0;
                if (exp.entregables) {
                    if (vistaActual === 'visitas' && exp.entregables.visita && exp.entregables.visita.archivos) {
                        prevFiles = exp.entregables.visita.archivos.length;
                    } else if (vistaActual === 'dibujos' && exp.entregables.dibujo && exp.entregables.dibujo.archivos) {
                        prevFiles = exp.entregables.dibujo.archivos.length;
                    }
                }
                
                let btnText = prevFiles > 0 ? `AGREGAR MÁS (${prevFiles})` : `SUBIR`;
                let btnBgColor = prevFiles > 0 ? `emerald` : colorBase; // Se pone verde si ya hay fotos
                let btnIcon = prevFiles > 0 ? `library_add` : (vistaActual === 'visitas' ? 'add_a_photo' : 'upload_file');

                const card = `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-800 relative overflow-hidden group">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-${colorBase}-100 dark:bg-${colorBase}-900/30 flex items-center justify-center text-${colorBase}-600"><span class="material-symbols-rounded text-xl">${icon}</span></div>
                                <div>
                                    <h4 class="text-sm font-black text-slate-800 dark:text-white leading-tight">${exp.clienteNombre || exp.cliente || 'Sin Nombre'}</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${exp.folio || exp.id.substring(0,6)}</p>
                                </div>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[9px] font-black text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 uppercase">${exp.estatus}</span>
                        </div>
                        <div class="space-y-2 mb-5">
                            <div class="flex items-start gap-2">
                                <span class="material-symbols-rounded text-sm ${coordsFinales ? 'text-emerald-500' : 'text-slate-400'} mt-0.5">location_on</span>
                                <p class="text-[11px] ${coordsFinales && direccionFinal.includes('GPS') ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'} leading-relaxed">${direccionFinal}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <a href="${linkGoogleMaps}" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all ${!coordsFinales ? 'opacity-50 pointer-events-none' : ''}"><span class="material-symbols-rounded text-lg text-slate-600 dark:text-slate-300">map</span><span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">VER MAPA</span></a>
                            
                            <button onclick="abrirSubida('${exp.id}', '${vistaActual === 'visitas' ? 'VISITA' : 'DIBUJO'}')" class="flex items-center justify-center gap-2 py-3 bg-${btnBgColor}-600 hover:bg-${btnBgColor}-700 text-white rounded-xl shadow-lg shadow-${btnBgColor}-500/20 transition-all">
                                <span class="material-symbols-rounded text-lg">${btnIcon}</span>
                                <span class="text-[11px] font-bold uppercase">${btnText}</span>
                            </button>
                        </div>
                    </div>`;
                container.innerHTML += card;
            });
        }
        
        function filtrarTareas() {
            const termino = document.getElementById('busqueda').value.toLowerCase();
            const cards = document.querySelectorAll('#contenedor-tareas > div');

            misExpedientes.forEach((exp, index) => {
                const nombre = (exp.clienteNombre || exp.cliente || '').toLowerCase();
                const folio = (exp.folio || exp.id).toLowerCase();
                const tarjeta = cards[index];

                if (tarjeta) {
                    if (nombre.includes(termino) || folio.includes(termino)) {
                        tarjeta.style.display = 'block';
                    } else {
                        tarjeta.style.display = 'none';
                    }
                }
            });
        }

        function switchTab(tab) {
            vistaActual = tab;
            document.getElementById('tab-visitas').className = tab === 'visitas' ? 'flex-1 pb-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition-all' : 'flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all';
            document.getElementById('tab-dibujos').className = tab === 'dibujos' ? 'flex-1 pb-3 text-xs font-bold text-orange-600 border-b-2 border-orange-600 transition-all' : 'flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all';
            iniciarMotorBusqueda();
        }

        let expActivoParaSubida = null;
        
        function abrirSubida(idExpediente, tipo) {
            expActivoParaSubida = misExpedientes.find(e => e.id === idExpediente);
            
            // 🔥 UX NUEVA: Confirmación si ya existen archivos (Evita subidas accidentales)
            let prevFiles = 0;
            if (expActivoParaSubida.entregables) {
                if (tipo === 'VISITA' && expActivoParaSubida.entregables.visita && expActivoParaSubida.entregables.visita.archivos) {
                    prevFiles = expActivoParaSubida.entregables.visita.archivos.length;
                } else if (tipo === 'DIBUJO' && expActivoParaSubida.entregables.dibujo && expActivoParaSubida.entregables.dibujo.archivos) {
                    prevFiles = expActivoParaSubida.entregables.dibujo.archivos.length;
                }
            }
            
            if (prevFiles > 0) {
                const conf = confirm(`Ya hay ${prevFiles} archivo(s) de ${tipo} guardados en este expediente.\n\n¿Deseas AGREGAR más archivos a la colección actual?`);
                if (!conf) return; // Si cancela, detenemos el proceso
            }

            if(tipo === 'VISITA') document.getElementById('input-visita').click();
            else document.getElementById('input-dibujo').click();
        }

        // 🔥 MOTOR DE SUBIDA EN COLA PARA GOOGLE DRIVE (CORREGIDO)
        async function procesarArchivos(event, tipo) {
            const files = Array.from(event.target.files);
            if(files.length === 0) return;

            const modal = document.getElementById('modal-upload');
            const status = document.getElementById('upload-status');
            const bar = document.getElementById('upload-progress');
            document.getElementById('upload-title').innerText = tipo === 'VISITA' ? '📸 Subiendo a Drive...' : '📐 Subiendo Planos...';
            document.getElementById('upload-warning').innerText = "Subiendo archivos uno por uno para garantizar el GPS. Por favor espera.";
            modal.classList.remove('hidden'); modal.classList.add('flex');

            try {
                // 📍 CAPTURAR GPS
                status.innerText = "Capturando coordenadas GPS de alta precisión...";
                let ubicacionCapturada = null;
                try {
                    ubicacionCapturada = await obtenerUbicacion();
                } catch (gpsError) {
                    console.warn("No se pudo obtener GPS:", gpsError);
                    // Opcional: alert("No se pudo obtener el GPS, se subirá sin coordenadas.");
                }

                const docRef = await db.collection('expedientes_avaluos').doc(expActivoParaSubida.id).get();
                const dataDb = docRef.data();
                
                let folderIdDestino = null;
                
                if (dataDb.driveSubfolders) {
                    const llavesFirebase = Object.keys(dataDb.driveSubfolders);
                    const encontrarCarpeta = (palabrasClave) => {
                        for (let llave of llavesFirebase) {
                            let llaveLimpia = llave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                            for (let palabra of palabrasClave) {
                                if (llaveLimpia.includes(palabra)) return dataDb.driveSubfolders[llave];
                            }
                        }
                        return null;
                    };

                    if (tipo === 'VISITA') folderIdDestino = encontrarCarpeta(['fotos', 'fotografias']);
                    else folderIdDestino = encontrarCarpeta(['proy', 'dibujo', 'planos']);
                }

                if (folderIdDestino && folderIdDestino.includes('drive.google.com')) {
                    const matchId = folderIdDestino.match(/(?:folders\/|id=)([a-zA-Z0-9_-]{15,})/);
                    if (matchId && matchId[1]) folderIdDestino = matchId[1];
                }

                if (!folderIdDestino) {
                    let carpetasExistentes = dataDb.driveSubfolders ? Object.keys(dataDb.driveSubfolders).join(', ') : 'Ninguna';
                    throw new Error(`Falta la carpeta para ${tipo}. Carpetas: [${carpetasExistentes}]`);
                }

                let archivosSubidosNuevos = [];

                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    status.innerText = `Optimizando ${i+1} de ${files.length}...\n${f.name}`;
                    
                    let cleanBase64;
                    let mimeParaGoogle = f.type;

                    if (f.type.startsWith('image/')) {
                        const options = { maxSizeMB: 1, maxWidthOrHeight: 1600, useWebWorker: true, preserveExif: true };
                        try {
                            const compressedFile = await imageCompression(f, options);
                            const base64Data = await fileToBase64(compressedFile);
                            cleanBase64 = base64Data.split(',')[1];
                            mimeParaGoogle = compressedFile.type;
                        } catch (e) {
                            const base64Data = await fileToBase64(f);
                            cleanBase64 = base64Data.split(',')[1];
                        }
                    } else {
                        const base64Data = await fileToBase64(f);
                        cleanBase64 = base64Data.split(',')[1];
                    }

                    status.innerText = `Enviando a Drive ${i+1} de ${files.length}...`;

                    const response = await fetch(SCRIPT_SUBIDA_URL, {
                        method: 'POST',
                        body: JSON.stringify({ filename: f.name, mimeType: mimeParaGoogle, base64: cleanBase64, folderId: folderIdDestino })
                    });
                    
                    const responseText = await response.text();
                    const result = JSON.parse(responseText);
                    if (result.exito) archivosSubidosNuevos.push({ nombre: f.name, url: result.url });

                    bar.style.width = `${((i+1)/files.length)*100}%`;
                }

                // 💾 GUARDAR EN FIREBASE CON COORDENADAS
                status.innerText = `Guardando en Base de Datos...`;
                
                let entregables = expActivoParaSubida.entregables || {};
                let archivosAnteriores = [];
                
                if (tipo === 'VISITA' && entregables.visita && entregables.visita.archivos) archivosAnteriores = entregables.visita.archivos;
                if (tipo === 'DIBUJO' && entregables.dibujo && entregables.dibujo.archivos) archivosAnteriores = entregables.dibujo.archivos;

                const archivosFinales = [...archivosAnteriores, ...archivosSubidosNuevos];

                const datosUpdate = {
                    entregables: entregables,
                    estatus: 'EN REVISIÓN'
                };

                // ✨ ESTO ES LO QUE FALTABA: Guardamos la ubicación real en el campo coordenadas
                if (ubicacionCapturada) {
                    datosUpdate.coordenadas = ubicacionCapturada;
                }

                if (tipo === 'VISITA') {
                    entregables.visita = { estatus: 'completado', fecha: new Date().toISOString(), archivos: archivosFinales, gps_entrega: ubicacionCapturada };
                } else {
                    entregables.dibujo = { estatus: 'completado', fecha: new Date().toISOString(), archivos: archivosFinales, gps_entrega: ubicacionCapturada };
                }

                await db.collection('expedientes_avaluos').doc(expActivoParaSubida.id).update(datosUpdate);

                await registrarLog(`ENTREGABLE DE ${tipo}`, `Subida de ${archivosSubidosNuevos.length} archivos. Ubicación: ${ubicacionCapturada || 'No disponible'}`, expActivoParaSubida.id);

                modal.classList.add('hidden'); modal.classList.remove('flex');
                alert(`✅ ¡Éxito! Se guardó la ubicación y los archivos.`);
                event.target.value = '';

            } catch (error) {
                console.error(error);
                alert("❌ Error: " + error.message);
                modal.classList.add('hidden'); modal.classList.remove('flex');
            }
        }

        // 🔥 NUEVO: SISTEMA DE AUDITORÍA PARA VISITADORES
        async function registrarLog(accion, detalle, expedienteId) {
            try {
                const userJson = localStorage.getItem('leezar_user_active');
                let usuario = 'Staff en Campo';
                if(userJson) {
                    const parsed = JSON.parse(userJson);
                    usuario = parsed.nombre || parsed.email || 'Staff';
                }
                
                await db.collection('logs').add({
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    usuario: usuario,
                    accion: accion,
                    detalle: detalle,
                    expedienteId: expedienteId, 
                    itemKey: 'ENTREGABLES_STAFF'      
                });
            } catch (e) { 
                console.error("Error al registrar log:", e); 
            }
        }

        // Pégalo justo antes de function fileToBase64(file)
        function obtenerUbicacion() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("Tu navegador no soporta geolocalización");
                    return;
                }

                const opciones = {
                    enableHighAccuracy: true, // Forzar GPS
                    timeout: 10000,           // 10 segundos máximo
                    maximumAge: 0             // No usar caché
                };

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const coords = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                        resolve(coords);
                    },
                    (error) => {
                        let mensaje = "Error de GPS";
                        if(error.code === 1) mensaje = "Permiso de ubicación denegado por el usuario.";
                        reject(mensaje);
                    },
                    opciones
                );
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.onload = iniciarMotorBusqueda;
    </script>
</body>
</html>
