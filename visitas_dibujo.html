<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitas y Dibujo | Avalúos</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { leezar: { 500: '#0d9488', 600: '#0f766e' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="js/layout.js"></script> 

    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-active { @apply text-indigo-600 border-b-2 border-indigo-600; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen">

    <main class="max-w-md mx-auto pb-24">
        <header class="p-6">
            <h1 class="text-3xl font-black text-slate-800 dark:text-white mb-1">Mis Tareas</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">Gestión de levantamientos y planos</p>
        </header>

        <div class="px-6 mb-6">
            <div class="flex border-b border-slate-200 dark:border-slate-800">
                <button onclick="switchTab('visitas')" id="tab-visitas" class="flex-1 pb-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition-all">
                    VISITAS (CAMPO)
                </button>
                <button onclick="switchTab('dibujos')" id="tab-dibujos" class="flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all">
                    DIBUJO (GABINETE)
                </button>
            </div>
        </div>

        <div class="px-6 mb-6">
            <div class="relative">
                <span class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                <input type="text" id="busqueda" oninput="filtrarTareas()" placeholder="Buscar cliente o folio..." 
                    class="w-full pl-12 pr-4 py-4 bg-white dark:bg-slate-900 border-none rounded-2xl shadow-sm text-sm font-medium focus:ring-2 focus:ring-indigo-500 dark:text-white transition-all">
            </div>
        </div>

        <div id="contenedor-tareas" class="px-6 space-y-4">
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <span class="material-symbols-rounded text-5xl animate-spin mb-4">sync</span>
                <p class="text-xs font-bold uppercase tracking-widest">Cargando tareas...</p>
            </div>
        </div>
    </main>

    <div id="modal-upload" class="fixed inset-0 z-[100] hidden bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl border border-slate-200 dark:border-slate-700">
            <span class="material-symbols-rounded animate-spin text-6xl text-indigo-500 mb-4 block">cloud_sync</span>
            <h3 class="text-xl font-black text-slate-800 dark:text-white mb-2" id="upload-title">Subiendo Archivos...</h3>
            <p class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-6" id="upload-status">Preparando archivos...</p>
            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-3 overflow-hidden shadow-inner">
                <div id="upload-progress" class="bg-indigo-500 h-full transition-all duration-300 relative" style="width: 0%">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
            <p class="text-[10px] text-slate-400 mt-4 font-medium">Por favor, no cierres esta pantalla.</p>
        </div>
    </div>

    <input type="file" id="input-visita" accept="image/*" multiple class="hidden" onchange="procesarArchivos(event, 'VISITA')">
    <input type="file" id="input-dibujo" accept=".pdf,.dwg,.dxf" multiple class="hidden" onchange="procesarArchivos(event, 'DIBUJO')">

    <script>
        const db = firebase.firestore();
        let misExpedientes = [];
        let vistaActual = 'visitas';
        const SCRIPT_SUBIDA_URL = 'https://script.google.com/macros/s/AKfycby7V-rXkUuG5m6A6oX7zQ9zQ9zQ9zQ9zQ9zQ/exec'; // Reemplaza con tu URL real

        async function iniciarMotorBusqueda() {
            const userJson = localStorage.getItem('leezar_user_active');
            if(!userJson) return;
            const user = JSON.parse(userJson);

            // Escuchar cambios en tiempo real
            db.collection('expedientes_avaluos')
                .where('estatus', 'in', ['VISITA PROGRAMADA', 'EN DIBUJO', 'PENDIENTE', 'EN REVISIÓN'])
                .onSnapshot(snapshot => {
                    misExpedientes = snapshot.docs.map(doc => {
                        const data = doc.data();
                        
                        // 🔥 1. CAZADOR DE COORDENADAS 
                        let coords = data.coordenadas || null;
                        if (!coords && data.checklist && data.checklist.UBICACION_MAPS) {
                            coords = data.checklist.UBICACION_MAPS.coordenadas || null;
                        }

                        // 🔥 2. CAZADOR DE DIRECCIÓN
                        let dir = data.ubicacion || data.direccion || data.municipio;
                        if ((!dir || dir === 'Sin dirección') && data.checklist && data.checklist.UBICACION_MAPS) {
                            dir = data.checklist.UBICACION_MAPS.direccion || data.checklist.UBICACION_MAPS.ubicacion || data.checklist.UBICACION_MAPS.address;
                        }
                        
                        // 🔥 3. MAGIA VISUAL: Si no hay calle, pero hay GPS, mostramos un mensaje bonito
                        if (!dir || dir === 'Sin dirección' || dir === 'Dirección no registrada') {
                            dir = coords ? `📍 Ubicación por GPS guardada` : 'Dirección no registrada';
                        }

                        return {
                            id: doc.id,
                            ...data,
                            direccion_limpia: dir,
                            coordenadas_limpias: coords
                        };
                    })
                    .filter(exp => {
                        if(vistaActual === 'visitas') return exp.visitador === user.email || exp.visitador_asignado === user.email;
                        return exp.dibujante === user.email || exp.dibujante_asignado === user.email;
                    });

                    renderizarTareas();
                });
        }

        function renderizarTareas() {
            const container = document.getElementById('contenedor-tareas');
            container.innerHTML = '';

            if(misExpedientes.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <div class="w-20 h-20 bg-slate-100 dark:bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-4">
                            <span class="material-symbols-rounded text-slate-400 text-4xl">bedtime</span>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 text-sm font-bold">No tienes tareas pendientes por ahora.</p>
                    </div>
                `;
                return;
            }

            misExpedientes.forEach(exp => {
                const colorBase = vistaActual === 'visitas' ? 'indigo' : 'orange';
                const icon = vistaActual === 'visitas' ? 'photo_camera' : 'architecture';
                
                let coordsFinales = exp.coordenadas_limpias;
                let direccionFinal = exp.direccion_limpia;

                // 🔥 LINK UNIVERSAL (Abre la App de Google Maps directo en Android/iOS)
                let linkGoogleMaps = '#';
                if (coordsFinales) {
                    linkGoogleMaps = `https://www.google.com/maps/search/?api=1&query=${coordsFinales}`; 
                }

                const card = `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-800 relative overflow-hidden group">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-${colorBase}-100 dark:bg-${colorBase}-900/30 flex items-center justify-center text-${colorBase}-600">
                                    <span class="material-symbols-rounded text-xl">${icon}</span>
                                </div>
                                <div>
                                    <h4 class="text-sm font-black text-slate-800 dark:text-white leading-tight">${exp.clienteNombre || exp.cliente || 'Sin Nombre'}</h4>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${exp.folio || exp.id.substring(0,6)}</p>
                                </div>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[9px] font-black text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 uppercase">
                                ${exp.estatus}
                            </span>
                        </div>

                        <div class="space-y-2 mb-5">
                            <div class="flex items-start gap-2">
                                <span class="material-symbols-rounded text-sm ${coordsFinales ? 'text-emerald-500' : 'text-slate-400'} mt-0.5">location_on</span>
                                <p class="text-[11px] ${coordsFinales && direccionFinal.includes('GPS') ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'} leading-relaxed">${direccionFinal}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <a href="${linkGoogleMaps}" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all ${!coordsFinales ? 'opacity-50 pointer-events-none' : ''}">
                                <span class="material-symbols-rounded text-lg text-slate-600 dark:text-slate-300">map</span>
                                <span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">VER MAPA</span>
                            </a>
                            <button onclick="abrirSubida('${exp.id}', '${vistaActual === 'visitas' ? 'VISITA' : 'DIBUJO'}')" 
                                class="flex items-center justify-center gap-2 py-3 bg-${colorBase}-600 hover:bg-${colorBase}-700 text-white rounded-xl shadow-lg shadow-${colorBase}-500/20 transition-all">
                                <span class="material-symbols-rounded text-lg">${vistaActual === 'visitas' ? 'add_a_photo' : 'upload_file'}</span>
                                <span class="text-[11px] font-bold uppercase">SUBIR</span>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function switchTab(tab) {
            vistaActual = tab;
            document.getElementById('tab-visitas').className = tab === 'visitas' ? 'flex-1 pb-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition-all' : 'flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all';
            document.getElementById('tab-dibujos').className = tab === 'dibujos' ? 'flex-1 pb-3 text-xs font-bold text-orange-600 border-b-2 border-orange-600 transition-all' : 'flex-1 pb-3 text-xs font-bold text-slate-400 border-b-2 border-transparent transition-all';
            iniciarMotorBusqueda();
        }

        let expActivoParaSubida = null;
        function abrirSubida(idExpediente, tipo) {
            expActivoParaSubida = misExpedientes.find(e => e.id === idExpediente);
            if(tipo === 'VISITA') document.getElementById('input-visita').click();
            else document.getElementById('input-dibujo').click();
        }

        async function procesarArchivos(event, tipo) {
            const files = event.target.files;
            if(!files || files.length === 0) return;

            const modal = document.getElementById('modal-upload');
            const status = document.getElementById('upload-status');
            const bar = document.getElementById('upload-progress');
            document.getElementById('upload-title').innerText = tipo === 'VISITA' ? '📸 Subiendo Fotos...' : '📐 Subiendo Planos...';
            
            modal.classList.remove('hidden'); modal.classList.add('flex');

            try {
                const docRef = await db.collection('expedientes_avaluos').doc(expActivoParaSubida.id).get();
                const dataDb = docRef.data();
                
                let folderIdDestino = null;
                if (dataDb.driveSubfolders) {
                    folderIdDestino = tipo === 'VISITA' ? dataDb.driveSubfolders['Fotografías'] : dataDb.driveSubfolders['Proy Arq'];
                }

                let archivosSubidos = [];

                for(let i=0; i<files.length; i++) {
                    const file = files[i];
                    status.innerText = `Subiendo ${i+1} de ${files.length}...\n${file.name}`;
                    
                    const base64Data = await fileToBase64(file);
                    const cleanBase64 = base64Data.split(',')[1];

                    // 🔥 VERSIÓN PRODUCCIÓN: Lee la URL real de Google Drive
                    const response = await fetch(SCRIPT_SUBIDA_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            filename: file.name,
                            mimeType: file.type,
                            base64: cleanBase64,
                            folderId: folderIdDestino
                        })
                    });

                    const result = await response.json();
                    if(result.exito) archivosSubidos.push({ nombre: file.name, url: result.url });
                    bar.style.width = `${((i+1)/files.length)*100}%`;
                }

                let actualizaciones = { estatus: 'EN REVISIÓN' };
                if (tipo === 'VISITA') {
                    // 🔥 BAUTIZO: Le damos nombre para que no diga "Sin nombre" en Mesa de Control
                    actualizaciones['checklist.FOTOS_INTERIORES_GENERAL.nombre'] = 'Reporte Fotográfico de Campo';
                    actualizaciones['checklist.FOTOS_INTERIORES_GENERAL.categoria'] = 'inmueble';
                    actualizaciones['checklist.FOTOS_INTERIORES_GENERAL.estatus'] = 'revision';
                    
                    archivosSubidos.forEach((arch, idx) => {
                        actualizaciones[`checklist.FOTO_EXTRA_${Date.now()}_${idx}`] = {
                            nombre: arch.nombre, url: arch.url, estatus: 'revision', categoria: 'inmueble', tipo: 'IMG'
                        };
                    });
                } else {
                    archivosSubidos.forEach((arch, idx) => {
                        const esPDF = arch.nombre.toLowerCase().includes('.pdf');
                        actualizaciones[`checklist.PLANO_${esPDF ? 'PDF' : 'CAD'}_${Date.now()}_${idx}`] = {
                            nombre: arch.nombre, url: arch.url, estatus: 'revision', categoria: 'inmueble', tipo: esPDF ? 'PDF' : 'TXT'
                        };
                    });
                }

                await db.collection('expedientes_avaluos').doc(expActivoParaSubida.id).update(actualizaciones);

                modal.classList.add('hidden'); modal.classList.remove('flex');
                alert("✅ ¡Éxito! Archivos enviados a Mesa de Control.");
                event.target.value = '';

            } catch (error) {
                console.error(error);
                alert("❌ Error al subir archivos. Verifica tu conexión.");
                modal.classList.add('hidden'); modal.classList.remove('flex');
            }
        }

        window.onload = iniciarMotorBusqueda;
    </script>
</body>
</html>
