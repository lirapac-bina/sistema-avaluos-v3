<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema Leezar - Infraestructura Digital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; } /* Fondo ligeramante más oscuro para que el blanco brille */
        
        /* Animaciones Sutiles */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { 
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; 
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        
        /* Efecto Cristal Premium (Bordes iluminados y profundidad) */
        .glass-card-premium {
            background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.7) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 
                0 20px 40px -10px rgba(0, 0, 0, 0.05),
                0 1px 3px rgba(0,0,0,0.02),
                inset 0 1px 0 rgba(255,255,255,1);
        }

        /* DISEÑO DEFENSIVO */
        .material-symbols-rounded {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: clip;
            max-width: 100%;
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-[700px] h-[700px] bg-gradient-to-br from-indigo-200/40 to-purple-200/20 rounded-full blur-3xl opacity-70"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-gradient-to-tr from-rose-200/40 to-orange-100/20 rounded-full blur-3xl opacity-70"></div>
    </div>

    <div class="z-10 w-full max-w-4xl flex flex-col items-center">
        
        <div class="text-center mb-14 fade-in-up relative">
            <div class="w-24 h-24 bg-white rounded-3xl shadow-[0_15px_30px_-10px_rgba(0,0,0,0.1)] border border-white flex items-center justify-center mx-auto mb-6 relative transform transition-transform hover:scale-105 duration-500">
                <img src="https://assets.zyrosite.com/YKb8g9DzkGUbzMqW/logo-eme-HZjebNvrO2hDhZOM.png" alt="Logo EME" class="h-12 w-auto object-contain drop-shadow-md">
                <div class="absolute -right-2 -bottom-2 bg-gradient-to-br from-emerald-400 to-emerald-600 w-5 h-5 rounded-full border-2 border-white shadow-md animate-pulse"></div>
            </div>
            <h1 class="text-4xl md:text-5xl font-black text-slate-800 tracking-tight mb-3 drop-shadow-sm">Ecosistema Leezar</h1>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest bg-white/50 inline-block px-4 py-1.5 rounded-full border border-white shadow-sm">Selecciona un módulo para autenticar</p>
        </div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-xl">
            
            <button onclick="iniciarSesion()" class="group glass-card-premium rounded-2xl p-5 text-left hover:-translate-y-1 hover:shadow-[0_15px_30px_-10px_rgba(225,29,72,0.15)] transition-all duration-300 fade-in-up delay-100 relative overflow-hidden flex flex-col w-full">
                <div class="absolute inset-0 bg-gradient-to-br from-rose-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white to-rose-50 border border-white shadow-[0_2px_8px_rgba(225,29,72,0.15)] text-rose-600 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform duration-300 shrink-0 relative z-10">
                    <span class="material-symbols-rounded text-xl drop-shadow-sm">real_estate_agent</span>
                </div>
                
                <div class="w-full relative z-10 flex-1">
                    <h2 class="text-lg font-black text-slate-800 mb-0.5 leading-tight group-hover:text-rose-600 transition-colors">EME</h2>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-snug">Centro Integral Inmobiliario</p>
                </div>
                
                <div class="mt-3 flex items-center text-[10px] font-bold text-rose-600 gap-1 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 relative z-10">
                    Acceder <span class="material-symbols-rounded text-[12px]">arrow_forward</span>
                </div>
            </button>

            <button onclick="window.location.href='estimaciones.html'" class="group glass-card-premium rounded-2xl p-5 text-left hover:-translate-y-1 hover:shadow-[0_15px_30px_-10px_rgba(79,70,229,0.15)] transition-all duration-300 fade-in-up delay-200 relative overflow-hidden flex flex-col w-full">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white to-indigo-50 border border-white shadow-[0_2px_8px_rgba(79,70,229,0.15)] text-indigo-600 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform duration-300 shrink-0 relative z-10">
                    <span class="material-symbols-rounded text-xl drop-shadow-sm">query_stats</span>
                </div>
                
                <div class="w-full relative z-10 flex-1">
                    <h2 class="text-lg font-black text-slate-800 mb-0.5 leading-tight group-hover:text-indigo-600 transition-colors">AvEME</h2>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-snug">Reporte Automatizado</p>
                </div>
                
                <div class="mt-3 flex items-center text-[10px] font-bold text-indigo-600 gap-1 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 relative z-10">
                    Generar Reporte <span class="material-symbols-rounded text-[12px]">arrow_forward</span>
                </div>
            </button>

            <button id="btn-hipoteca" onclick="iniciarSesionHipotecas()" class="group glass-card-premium rounded-2xl p-5 text-left hover:-translate-y-1 hover:shadow-[0_15px_30px_-10px_rgba(16,185,129,0.15)] transition-all duration-300 fade-in-up delay-300 relative overflow-hidden flex flex-col w-full">
                <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white to-emerald-50 border border-white shadow-[0_2px_8px_rgba(16,185,129,0.15)] text-emerald-600 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform duration-300 shrink-0 relative z-10">
                    <span class="material-symbols-rounded text-xl drop-shadow-sm">account_balance</span>
                </div>
                
                <div class="w-full relative z-10 flex-1">
                    <h2 class="text-lg font-black text-slate-800 mb-0.5 leading-tight group-hover:text-emerald-600 transition-colors">Hipoteca Fácil</h2>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-snug">Gestión Crediticia</p>
                </div>
                
                <div class="mt-3 flex items-center text-[10px] font-bold text-emerald-600 gap-1 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 relative z-10">
                    Acceder <span class="material-symbols-rounded text-[12px]">arrow_forward</span>
                </div>
            </button>

            <div class="relative w-full fade-in-up delay-400">
                <div class="absolute -top-2 -right-2 bg-gradient-to-r from-slate-700 to-slate-900 text-white text-[7px] font-black px-2.5 py-1 rounded-full shadow-lg z-20 tracking-widest uppercase border border-slate-600">
                    Próximamente
                </div>
                <button class="w-full glass-card-premium rounded-2xl p-5 text-left opacity-60 cursor-not-allowed relative overflow-hidden group flex flex-col w-full">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white to-slate-100 border border-white shadow-sm text-slate-400 flex items-center justify-center mb-3 shrink-0">
                        <span class="material-symbols-rounded text-xl">architecture</span>
                    </div>
                    
                    <div class="w-full relative z-10 flex-1">
                        <div class="flex items-center justify-between mb-0.5">
                            <h2 class="text-lg font-black text-slate-500 leading-tight">HS Arq</h2>
                            <span class="material-symbols-rounded text-lg text-slate-300">lock</span>
                        </div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-snug">Arquitectura y Diseño</p>
                    </div>
                </button>
            </div>

        </div>

        <div class="mt-16 fade-in-up delay-400 flex flex-col items-center">
            <div class="flex items-center gap-2 px-6 py-3 bg-white/80 backdrop-blur-xl rounded-full border border-white shadow-sm hover:shadow-md transition-shadow">
                <span class="material-symbols-rounded text-emerald-500 text-sm drop-shadow-sm">shield</span>
                <span class="text-slate-500 text-[10px] font-black tracking-widest uppercase">Plataforma Encriptada TLS 1.3</span>
            </div>
            
            <div id="error-msg" class="hidden mt-4 text-rose-500 text-xs bg-rose-50 px-4 py-2 rounded-xl border border-rose-100 flex items-center shadow-sm font-bold tracking-wide">
                <span class="material-symbols-rounded text-sm mr-2">error</span>
                <span id="error-text">Error de conexión</span>
            </div>
        </div>

    </div>

    <script>
        // --- Lógica de Autenticación EME ---
        async function iniciarSesion() {
            const errorDiv = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<div class="flex items-center justify-center h-full w-full text-rose-600"><span class="material-symbols-rounded animate-spin text-4xl drop-shadow-md">sync</span></div>';
            btn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/auth-start');
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                const data = await response.json();
                if (data.authUrl) window.location.href = data.authUrl;
                else throw new Error('Sin URL de autorización');
            } catch (error) {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                errorText.innerText = "Error: Sistema de autenticación no disponible.";
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 4000);
            }
        }

        // --- Lógica de Autenticación Hipotecas ---
        async function iniciarSesionHipotecas() {
            const errorDiv = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('btn-hipoteca');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<div class="flex items-center justify-center h-full w-full text-emerald-600"><span class="material-symbols-rounded animate-spin text-4xl drop-shadow-md">sync</span></div>';
            btn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/auth-start');
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                const data = await response.json();
                if (data.authUrl) {
                    sessionStorage.setItem('modulo_destino', 'hipotecas');
                    window.location.href = data.authUrl;
                } else throw new Error('Sin URL de autorización');
            } catch (error) {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                errorText.innerText = "Error: Sistema de autenticación no disponible.";
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 4000);
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                const errorDiv = document.getElementById('error-msg');
                document.getElementById('error-text').innerText = "Acceso denegado o cancelado.";
                errorDiv.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
