<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Avalúo - Leezar V3</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script src="i18n.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        leezar: { 500: '#0f172a', 600: '#1e293b', accent: '#0d9488' },
                        jack: { 500: '#6366f1', 600: '#4f46e5' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { 'glass': '0 4px 30px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

</head>

<body class="bg-slate-50 dark:bg-slate-900 h-screen flex flex-col overflow-hidden text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <header class="h-14 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition text-slate-500">
                <span class="material-symbols-rounded">arrow_back</span>
            </a>
            <div>
                <h1 class="font-bold text-sm text-leezar-600 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-rounded text-leezar-500 text-base">architecture</span>
                    Captura de Avalúo </h1>
                <p class="text-[10px] text-slate-400">Folio: <span id="lbl-folio">Cargando...</span></p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="setLanguage('es')" class="text-lg hover:scale-110 transition" title="Español">🇲🇽</button>
            <button onclick="setLanguage('en')" class="text-lg hover:scale-110 transition" title="English">🇺🇸</button>
            <div class="h-6 w-px bg-slate-200 dark:bg-slate-600 mx-1"></div>
            <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-yellow-500 transition">
                <span class="material-symbols-rounded text-xl" id="theme-icon">light_mode</span>
            </button>
            <button class="bg-leezar-600 hover:bg-leezar-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-lg shadow-leezar-500/30 flex items-center gap-2 transition-all active:scale-95" onclick="guardarProgreso()">
                <span class="material-symbols-rounded text-sm">save</span>
                <span data-i18n="ui_save">Guardar</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all duration-300 absolute md:relative z-10 h-full" id="sidebar-menu">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Secciones</p>
                <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-leezar-500 h-full w-[5%]" id="progress-bar"></div>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto custom-scroll p-2 space-y-1" id="secciones-lista">
                </nav>
        </aside>

        <div class="max-w-4xl mx-auto mt-6 space-y-6">
    
    <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-lg font-black text-leezar-accent dark:text-teal-400 mb-4 border-b border-slate-100 dark:border-slate-700 pb-2" data-i18n="sec_1">
            Dirección del Inmueble
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_calle">Calle / Avenida</label>
                <input type="text" data-i18n="ph_calle" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_num_ext">Num. Ext.</label>
                    <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_num_int">Num. Int.</label>
                    <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_colonia">Colonia / Barrio</label>
                <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_cp">Código Postal</label>
                <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_municipio">Municipio / Alcaldía</label>
                <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_estado">Estado</label>
                <input type="text" data-i18n="ph_escribe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>
        </div>
    </section>

    <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-lg font-black text-leezar-accent dark:text-teal-400 mb-4 border-b border-slate-100 dark:border-slate-700 pb-2" data-i18n="sec_solicitante">
            Datos del Solicitante
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_nombre_solicitante">Nombre Completo</label>
                <input type="text" data-i18n="ph_nombre" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1" data-i18n="lbl_proposito">Propósito del Avalúo</label>
                <select class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all dark:text-white">
                    <option value="" data-i18n="opt_seleccionar">Seleccione una opción...</option>
                    <option value="infonavit">Infonavit</option>
                    <option value="fovissste">Fovissste</option>
                    <option value="bancario">Bancario</option>
                </select>
            </div>
        </div>
    </section>
    </div>

        </main>
    </div>

    <script src="app.js"></script>
    <script src="logic-hoja-trabajo.js"></script>
</body>
</html>
