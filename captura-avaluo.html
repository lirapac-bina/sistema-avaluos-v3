<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Avalúo - Leezar V3</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    
    <script src="i18n.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        leezar: { 500: '#0f172a', 600: '#1e293b', accent: '#0d9488' },
                        jack: { 500: '#6366f1', 600: '#4f46e5' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { 'glass': '0 4px 30px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

</head>

<body class="bg-slate-50 dark:bg-slate-900 h-screen flex flex-col overflow-hidden text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <header class="h-14 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition text-slate-500">
                <span class="material-symbols-rounded">arrow_back</span>
            </a>
            <div>
                <h1 class="font-bold text-sm text-leezar-600 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-rounded text-leezar-500 text-base">architecture</span>
                    Captura de Avalúo </h1>
                <p class="text-[10px] text-slate-400">Folio: <span id="lbl-folio">Cargando...</span></p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="setLanguage('es')" class="text-lg hover:scale-110 transition" title="Español">🇲🇽</button>
            <button onclick="setLanguage('en')" class="text-lg hover:scale-110 transition" title="English">🇺🇸</button>
            <div class="h-6 w-px bg-slate-200 dark:bg-slate-600 mx-1"></div>
            <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-yellow-500 transition">
                <span class="material-symbols-rounded text-xl" id="theme-icon">light_mode</span>
            </button>
            <button class="bg-leezar-600 hover:bg-leezar-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-lg shadow-leezar-500/30 flex items-center gap-2 transition-all active:scale-95" onclick="guardarProgreso()">
                <span class="material-symbols-rounded text-sm">save</span>
                <span data-i18n="ui_save">Guardar</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all duration-300 absolute md:relative z-10 h-full" id="sidebar-menu">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Secciones</p>
                <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-leezar-500 h-full w-[5%]" id="progress-bar"></div>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto custom-scroll p-2 space-y-1" id="secciones-lista">
                </nav>
        </aside>

        <main class="flex-1 relative overflow-hidden flex flex-col bg-slate-50 dark:bg-slate-900">
            
            <div id="dynamic-form-container" class="flex-1 overflow-y-auto p-6 md:p-10 max-w-4xl mx-auto w-full fade-in pb-24">
                <div class="flex flex-col items-center justify-center h-full text-slate-400 animate-pulse">
                    <span class="material-symbols-rounded text-4xl mb-2">hourglass_empty</span>
                    <p>Iniciando sistema de captura...</p>
                </div>
            </div>

            <div id="jack-chat" class="absolute bottom-6 right-6 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 transform translate-y-[110%] transition-transform duration-300 flex flex-col z-50 max-h-[500px]">
                <div class="bg-jack-600 p-4 rounded-t-2xl flex justify-between items-center text-white shadow-md">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-rounded">smart_toy</span>
                        <h3 class="font-bold text-sm">Asistente Jack</h3>
                    </div>
                    <button onclick="toggleJack()" class="hover:bg-white/20 rounded-full p-1 transition"><span class="material-symbols-rounded">expand_more</span></button>
                </div>
                <div class="flex-1 bg-slate-50 dark:bg-slate-900 p-4 overflow-y-auto" id="jack-messages">
                    <div class="flex gap-3 mb-4">
                        <div class="w-6 h-6 rounded-full bg-jack-100 dark:bg-jack-900/50 flex-shrink-0 flex items-center justify-center text-jack-600 text-xs font-bold">J</div>
                        <div class="bg-white dark:bg-slate-800 p-3 rounded-tr-xl rounded-br-xl rounded-bl-xl shadow-sm text-xs text-slate-600 dark:text-slate-300 border border-slate-100 dark:border-slate-700">
                            <p id="jack-greeting">Hola. Estoy listo para ayudarte.</p>
                        </div>
                    </div>
                </div>
                <div class="p-3 border-t border-slate-100 dark:border-slate-700 flex gap-2 bg-white dark:bg-slate-800 shrink-0">
                    <input type="text" id="jack-input" placeholder="Escribe aquí..." class="flex-1 bg-slate-100 dark:bg-slate-900 border-0 rounded-lg px-3 py-2 text-xs focus:ring-1 focus:ring-jack-500 dark:text-white outline-none transition">
                    <button onclick="preguntarAJack()" class="p-2 bg-jack-600 hover:bg-jack-700 text-white rounded-lg transition shadow-md active:scale-95"><span class="material-symbols-rounded text-lg">send</span></button>
                </div>
            </div>
            
            <button onclick="toggleJack()" class="absolute bottom-6 right-6 w-12 h-12 bg-jack-600 hover:bg-jack-500 rounded-full shadow-lg shadow-jack-600/30 flex items-center justify-center text-white transition-all hover:scale-110 active:scale-95 z-40">
                <span class="material-symbols-rounded text-2xl">smart_toy</span>
            </button>

        </main>
    </div>

    <script src="app.js"></script>
    <script src="logic-hoja-trabajo.js"></script>
</body>
</html>
