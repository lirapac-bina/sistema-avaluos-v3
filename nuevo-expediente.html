<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Avalúo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { leezar: { 500: '#0d9488', 600: '#0f766e' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script src="js/layout.js"></script>
    
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .fade-in-up { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl w-full max-w-3xl overflow-hidden border border-gray-100 dark:border-slate-700 relative z-10 fade-in-up">
        
        <div class="bg-white dark:bg-slate-800 p-8 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center">
            <div>
                <h1 class="text-gray-800 dark:text-white text-2xl font-extrabold flex items-center gap-2 tracking-tight">
                    <span class="material-symbols-rounded text-teal-600 dark:text-teal-400 text-3xl">home_work</span> Nuevo Avalúo
                </h1>
                <p class="text-gray-400 dark:text-slate-400 text-sm mt-1 font-medium">Sistema de Gestión de Avalúos</p>
            </div>
            <a href="gestion.html" class="text-gray-400 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 transition flex items-center gap-1 text-sm font-bold bg-gray-50 dark:bg-slate-700 px-4 py-2 rounded-full">
                <span class="material-symbols-rounded text-lg">arrow_back</span> Cancelar
            </a>
        </div>

        <div class="p-8 md:p-10 bg-slate-50 dark:bg-slate-900/50">
            <form id="form-nuevo" onsubmit="crearExpediente(event)">

                <div class="mb-8 p-6 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                    <label class="block text-xs font-bold text-gray-400 dark:text-slate-500 mb-4 ml-1 uppercase tracking-widest text-center">Selecciona la Unidad de Valuación</label>
                    <div class="grid grid-cols-3 gap-4">
                        <label class="cursor-pointer group">
                            <input type="radio" name="unidad" value="AVE" checked class="peer hidden">
                            <div class="py-4 px-2 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-400 font-bold text-center peer-checked:border-teal-500 peer-checked:text-teal-600 peer-checked:bg-teal-50 dark:peer-checked:bg-teal-900/20 transition-all flex flex-col items-center gap-2 group-hover:border-teal-300">
                                <span class="material-symbols-rounded text-3xl">apartment</span>
                                <span class="text-[10px] md:text-xs uppercase">Leezar (AVE)</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="unidad" value="EME" class="peer hidden">
                            <div class="py-4 px-2 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-400 font-bold text-center peer-checked:border-indigo-500 peer-checked:text-indigo-600 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-900/20 transition-all flex flex-col items-center gap-2 group-hover:border-indigo-300">
                                <span class="material-symbols-rounded text-3xl">domain</span>
                                <span class="text-[10px] md:text-xs uppercase">Unidad EME</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="unidad" value="PNA" class="peer hidden">
                            <div class="py-4 px-2 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-400 font-bold text-center peer-checked:border-blue-500 peer-checked:text-blue-600 peer-checked:bg-blue-50 dark:peer-checked:bg-blue-900/20 transition-all flex flex-col items-center gap-2 group-hover:border-blue-300">
                                <span class="material-symbols-rounded text-3xl">corporate_fare</span>
                                <span class="text-[10px] md:text-xs uppercase">Unidad PNA</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 dark:text-slate-500 mb-2 ml-1 uppercase">Cliente / Solicitante</label>
                        <input type="text" id="nombre" required class="w-full pl-4 pr-4 py-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-semibold text-gray-700 dark:text-gray-200 uppercase" placeholder="NOMBRE COMPLETO">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 dark:text-slate-500 mb-2 ml-1 uppercase">WhatsApp</label>
                        <input type="tel" id="telefono" required maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full pl-4 pr-4 py-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none font-semibold text-gray-700 dark:text-gray-200" placeholder="10 DÍGITOS">
                    </div>
                </div>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 dark:text-slate-500 mb-2 ml-1 uppercase">Ubicación del Inmueble</label>
                        <div class="relative">
                            <select id="estado" class="w-full pl-4 pr-10 py-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none appearance-none cursor-pointer font-medium text-gray-700 dark:text-gray-200">
                                <option value="">Cargando catálogo...</option>
                            </select>
                            <span class="material-symbols-rounded absolute right-3 top-3 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 dark:text-slate-500 mb-2 ml-1 uppercase">Tipo de Avalúo</label>
                        <div class="relative">
                            <select id="tipoTramite" disabled class="w-full pl-4 pr-10 py-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none appearance-none cursor-pointer font-medium text-gray-700 dark:text-gray-200 disabled:opacity-50">
                                <option value="">Esperando ubicación...</option>
                            </select>
                            <span class="material-symbols-rounded absolute right-3 top-3 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-crear" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 text-lg shadow-lg transition-all transform hover:-translate-y-0.5">
                    <span class="material-symbols-rounded">rocket_launch</span> Generar Expediente
                </button>
            </form>

            <div id="resultado" class="hidden mt-6 text-center fade-in-up">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-gray-100 dark:border-slate-700 shadow-sm mb-6 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-teal-400 to-emerald-400"></div>
                    <div class="w-16 h-16 bg-teal-50 dark:bg-teal-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-rounded text-3xl text-teal-600 dark:text-teal-400">check</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-1">¡Listo!</h3>
                    <p class="text-gray-400 dark:text-slate-400 text-sm mb-6">Expediente creado con éxito.</p>
                    
                    <div class="text-left bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                        <label class="text-xs font-bold text-slate-400 ml-1 mb-2 block uppercase">Enlace del Portal:</label>
                        <div class="flex gap-2">
                            <input type="text" id="liga-generada" readonly class="w-full p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-sm font-mono">
                            <button onclick="copiarLiga()" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:text-teal-600 px-4 rounded-lg font-bold text-sm" id="btn-copy">Copiar</button>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col gap-3">
                    <a id="btn-whatsapp" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-[#1da851] text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 text-lg">
                        <span class="material-symbols-rounded text-2xl">chat</span> Enviar por WhatsApp
                    </a>
                    <a id="btn-ver-portal" href="#" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 text-lg">
                        <span class="material-symbols-rounded">visibility</span> Ver Portal del Cliente
                    </a>
                    <button onclick="location.reload()" class="mt-4 text-sm text-gray-400 hover:text-teal-600 underline">Crear otro expediente</button>
                </div>
            </div>
        </div>
    </div>

<script>
let catalogoGlobal = {}; 

        document.addEventListener('DOMContentLoaded', cargarCatalogo);

        async function cargarCatalogo() {
            const selectEstado = document.getElementById('estado');
            try {
                const res = await fetch('/.netlify/functions/admin-catalog');
                if(!res.ok) throw new Error("Error en la red");
                const data = await res.json();
                
                // 🔥 ESTA ES LA LÍNEA CRÍTICA QUE ARREGLA LOS MENÚS
                catalogoGlobal = data.matriz || data; 
                
                selectEstado.innerHTML = '<option value="">Selecciona Ubicación</option>';
                const ubicaciones = Object.keys(catalogoGlobal).sort();

                if (ubicaciones.length === 0 || (ubicaciones.length === 2 && ubicaciones.includes('diccionario'))) {
                    selectEstado.innerHTML = '<option value="">Sin ubicaciones configuradas</option>';
                    return;
                }

                ubicaciones.forEach(ub => {
                    const option = document.createElement('option');
                    option.value = ub; 
                    option.textContent = ub.replace(/_/g, ' '); 
                    selectEstado.appendChild(option);
                });
            } catch (e) {
                console.error("Error catálogo:", e);
                selectEstado.innerHTML = '<option value="">Error al cargar catálogo</option>';
            }
        }

        document.getElementById('estado').addEventListener('change', (e) => {
            const selectTramite = document.getElementById('tipoTramite');
            const ubicacion = e.target.value;
            selectTramite.innerHTML = '<option value="">Selecciona trámite</option>';
            
            if (ubicacion && catalogoGlobal[ubicacion]) {
                const servicios = Object.keys(catalogoGlobal[ubicacion]).sort();
                servicios.forEach(serv => {
                    const option = document.createElement('option');
                    option.value = serv;
                    option.textContent = serv.replace(/_/g, ' ');
                    selectTramite.appendChild(option);
                });
                selectTramite.disabled = false;
            } else {
                selectTramite.disabled = true;
            }
        });

        async function crearExpediente(e) {
            if (e) e.preventDefault();
            const btn = document.getElementById('btn-crear');
            const originalContent = btn.innerHTML;
            
            const nombreInput = document.getElementById('nombre').value.toUpperCase().trim();
            const telefonoInput = document.getElementById('telefono').value.trim();
            const tramite = document.getElementById('tipoTramite').value;
            const ubicacion = document.getElementById('estado').value;
            const unidadEl = document.querySelector('input[name="unidad"]:checked');
            const valorUnidad = unidadEl ? unidadEl.value : 'AVE';

            if (!nombreInput || !telefonoInput || !tramite || !ubicacion) {
                alert("⚠️ Por favor, completa todos los campos.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = `<span class="animate-spin material-symbols-rounded">sync</span> Generando...`;

                const response = await fetch('/.netlify/functions/create-expediente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nombreInput,
                        telefono: telefonoInput,
                        tipoTramite: tramite, 
                        entidad: ubicacion, 
                        numSolicitantes: 1, 
                        numPropietarios: 1, 
                        unidad: valorUnidad
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Error en el servidor");
                }

                const json = await response.json();

                document.getElementById('form-nuevo').classList.add('hidden');
                document.getElementById('resultado').classList.remove('hidden');
                
                const finalId = json.id;
                const cleanUrl = `${window.location.origin}/portal.html?id=${finalId}`;
                
                document.getElementById('liga-generada').value = cleanUrl;
                document.getElementById('btn-ver-portal').href = cleanUrl;
                
                const mensaje = `Hola *${nombreInput}*, hemos generado tu expediente digital. Por favor sube tus documentos aquí: ${cleanUrl}`;
                document.getElementById('btn-whatsapp').href = `https://api.whatsapp.com/send?phone=52${telefonoInput}&text=${encodeURIComponent(mensaje)}`;

            } catch (error) {
                console.error("Error crítico:", error);
                alert("❌ Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        function copiarLiga() {
            const copyText = document.getElementById("liga-generada");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.getElementById('btn-copy');
            const originalText = btn.innerHTML;
            btn.innerHTML = '¡Copiado!';
            setTimeout(() => { btn.innerHTML = originalText; }, 2000);
        }
    </script>
</body>
</html>
