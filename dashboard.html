<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Ing. Leezar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { leezar: { 500: '#0d9488', 600: '#0f766e' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="js/layout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <main class="p-10 fade-in">
        <header class="flex justify-between items-end mb-10">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">Panel de Control</h1>
                <p class="text-slate-400 dark:text-slate-500 mt-1">Resumen de actividad inmobiliaria</p>
            </div>
            <span class="text-sm font-medium bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm text-slate-500 dark:text-slate-300 border border-slate-100 dark:border-slate-700" id="fecha-actual"></span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md transition-all group">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">En Proceso</p>
                        <p class="text-4xl font-extrabold text-slate-800 dark:text-white group-hover:text-teal-600 transition-colors">12</p>
                    </div>
                    <div class="p-3 bg-teal-50 dark:bg-teal-900/30 rounded-xl text-teal-600 dark:text-teal-400">
                        <span class="material-symbols-rounded text-2xl">folder_open</span>
                    </div>
                </div>
            </div>
            
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md transition-all group">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Por Asignar</p>
                        <p class="text-4xl font-extrabold text-slate-800 dark:text-white group-hover:text-orange-500 transition-colors">4</p>
                    </div>
                    <div class="p-3 bg-orange-50 dark:bg-orange-900/30 rounded-xl text-orange-500 dark:text-orange-400">
                        <span class="material-symbols-rounded text-2xl">assignment_ind</span>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md transition-all group">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1">Terminados (Mes)</p>
                        <p class="text-4xl font-extrabold text-slate-800 dark:text-white group-hover:text-blue-600 transition-colors">8</p>
                    </div>
                    <div class="p-3 bg-blue-50 dark:bg-blue-900/30 rounded-xl text-blue-600 dark:text-blue-400">
                        <span class="material-symbols-rounded text-2xl">verified</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <a href="nuevo-expediente.html" class="relative overflow-hidden bg-teal-600 rounded-3xl p-8 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all group cursor-pointer">
                <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="relative z-10 flex justify-between items-center">
                    <div>
                        <h3 class="text-2xl font-bold text-white mb-2">Nuevo Expediente</h3>
                        <p class="text-teal-100 text-sm font-medium">Crear solicitud de avalúo o hipoteca</p>
                    </div>
                    <span class="material-symbols-rounded text-5xl text-white bg-white/20 p-3 rounded-2xl backdrop-blur-sm group-hover:rotate-90 transition-transform duration-500">add</span>
                </div>
            </a>
            
            <a href="gestion.html" class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-md border border-slate-100 dark:border-slate-700 hover:border-teal-200 dark:hover:border-teal-800 hover:shadow-xl hover:-translate-y-1 transition-all group cursor-pointer flex justify-between items-center">
                <div>
                    <h3 class="text-2xl font-bold text-slate-800 dark:text-white mb-2 group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">Buscador Global</h3>
                    <p class="text-slate-400 dark:text-slate-500 text-sm font-medium">Localizar, filtrar y asignar</p>
                </div>
                <span class="material-symbols-rounded text-5xl text-slate-200 dark:text-slate-600 group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">search</span>
            </a>
        </div>
    </main>
    <script>
        document.getElementById('fecha-actual').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    </script>
</body>
</html>
