            },
            {
                nombre: "Caso 10: Veracruz, Xalapa (Local / Unicornio)",
                payload: { "perfil_solicitante": 1, "Tipo_Inmueble": "Casa", "Estado": "Veracruz", "CP": "91000", "Calle_Sujeto": "Enríquez", "Ciudad_Municipio": "Xalapa", "Colonia": "Centro", "Geolocalizacion_Google": "19.5277,-96.9203", "Superficie_Terreno": 500, "Superficie_Construccion": 900, "Clase_Inmueble": "RESIDENCIAL", "Estado_Conservacion": "REGULAR", "No_Recamaras": 11, "No_Banos": 6, "No_Estacionamientos": 2, "Edad_Anos": 35, "Uso_de_Suelo": "Comercial", "Calidad_Acabados": "Estándar", "Topografia": "Ascendente", "Ubicacion_en_Manzana": "Esquina", "Frente_a": "Avenida" }
            }
        ];

        // Verificar sesión activa
        auth.onAuthStateChanged((user) => {
            if (user) {
                authUser = user;
                document.getElementById('auth-warning').classList.add('hidden');
                document.getElementById('btn-iniciar').disabled = false;
                document.getElementById('btn-iniciar').classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                authUser = null;
                document.getElementById('auth-warning').classList.remove('hidden');
                document.getElementById('btn-iniciar').disabled = true;
                document.getElementById('btn-iniciar').classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        // Generador de Tarjetas de Log (Ahora con Detalles)
        function crearTarjetaLog(id, titulo, detalles) {
            const container = document.getElementById('log-container');
            document.getElementById('empty-state')?.remove();

            const html = `
            <div id="card-${id}" class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex flex-col gap-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-slate-200 text-sm">${titulo}</h3>
                        <p class="text-[10px] text-emerald-500/70 font-mono mt-1 uppercase tracking-widest">${detalles}</p>
                    </div>
                    <span id="badge-${id}" class="bg-slate-700 text-slate-400 text-[10px] font-mono px-2 py-1 rounded-full animate-pulse border border-slate-600 h-fit whitespace-nowrap ml-2">EN COLA...</span>
                </div>
                <div class="bg-slate-900 rounded-lg p-4 font-mono text-[11px] text-slate-400 relative overflow-hidden">
                    <div id="loader-${id}" class="absolute top-0 left-0 w-1 bg-leezar-500 h-full hidden"></div>
                    <p id="status-${id}">> Esperando inicio de test...</p>
                    <p id="timer-${id}" class="text-teal-400 mt-2 font-bold hidden"></p>
                </div>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function actualizarTarjetaLog(id, estatus, mensaje, tiempoMs = null, esError = false) {
            const badge = document.getElementById(`badge-${id}`);
            const statusTxt = document.getElementById(`status-${id}`);
            const loader = document.getElementById(`loader-${id}`);
            const timer = document.getElementById(`timer-${id}`);

            statusTxt.innerHTML += `<br>> ${mensaje}`;

            if (estatus === 'PROCESANDO') {
                badge.className = "bg-leezar-900 text-leezar-400 text-[10px] font-mono px-2 py-1 rounded-full animate-pulse border border-leezar-500";
                badge.innerText = "PROCESANDO";
                loader.classList.remove('hidden');
            } else if (estatus === 'COMPLETADO') {
                badge.className = "bg-emerald-900 text-emerald-400 text-[10px] font-mono px-2 py-1 rounded-full border border-emerald-500";
                badge.innerText = "ÉXITO";
                loader.classList.replace('bg-leezar-500', 'bg-emerald-500');
                if (tiempoMs) {
                    timer.classList.remove('hidden');
                    timer.innerText = `⏱️ Tiempo de respuesta de IA: ${(tiempoMs / 1000).toFixed(2)} segundos`;
                }
            } else if (estatus === 'ERROR') {
                badge.className = "bg-red-900 text-red-400 text-[10px] font-mono px-2 py-1 rounded-full border border-red-500";
                badge.innerText = "FALLÓ";
                loader.classList.replace('bg-leezar-500', 'bg-red-500');
                if (esError) statusTxt.classList.add('text-red-400');
            }
        }

        async function iniciarPruebasDeDolor() {
            if (!authUser) return;
            document.getElementById('log-container').innerHTML = ''; // Limpiar logs anteriores
            
            const btn = document.getElementById('btn-iniciar');
            btn.innerHTML = '<span class="material-symbols-rounded animate-spin">sync</span> Ejecutando Peticiones...';
            btn.disabled = true;

            const idToken = await authUser.getIdToken(true);

            // Disparar todos los tests en paralelo para medir el estrés real del servidor
            const promesas = testPayloads.map(async (test, index) => {
                const expedienteTestId = `TEST_${authUser.uid}_${Date.now()}_${index}`;
                
                // EXTRAEMOS LA RADIOGRAFÍA DE LA CASA PARA MOSTRARLA EN PANTALLA
                const p = test.payload;
                const detallesCasa = `Terr: ${p.Superficie_Terreno}m² | Const: ${p.Superficie_Construccion}m² | 🛏️ ${p.No_Recamaras} | 🛁 ${p.No_Banos} | 🚗 ${p.No_Estacionamientos} | Edad: ${p.Edad_Anos}a | ${p.Clase_Inmueble}`;
                
                // Le pasamos el tercer parámetro a la tarjeta
                crearTarjetaLog(expedienteTestId, test.nombre, detallesCasa);
                
                const tiempoInicio = Date.now();
                actualizarTarjetaLog(expedienteTestId, 'PROCESANDO', 'Petición asíncrona enviada a Netlify (Fire and Forget)...');

                // Listener en tiempo real de Firebase
                return new Promise((resolve) => {
                    const unsubscribe = db.collection('expedientes_avaluos').doc(expedienteTestId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const dataDoc = doc.data();
                            
                            if (dataDoc.estatus_motor === 'PROCESANDO') {
                                // Evitar duplicar logs
                            } else if (dataDoc.estatus_motor === 'COMPLETADO') {
                                const tiempoFin = Date.now();
                                const duracionMs = tiempoFin - tiempoInicio;
                                const valorDevuelto = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(dataDoc.resultados_motor.data.valor_final);
                                
                                actualizarTarjetaLog(expedienteTestId, 'COMPLETADO', `Motor Beta 188 Finalizado. Valor dictaminado: ${valorDevuelto}`, duracionMs);
                                unsubscribe();
                                resolve();
                            } else if (dataDoc.estatus_motor === 'ERROR') {
                                actualizarTarjetaLog(expedienteTestId, 'ERROR', `Error del motor: ${dataDoc.error_motor}`, null, true);
                                unsubscribe();
                                resolve();
                            }
                        }
                    });

                    // Lanzar la petición asíncrona (Arquitectura Empresarial)
                    fetch('/.netlify/functions/calcular-estimacion-background', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` }, 
                        body: JSON.stringify({ parametros_motor: test.payload, expedienteId: expedienteTestId }) 
                    }).catch(err => {
                        actualizarTarjetaLog(expedienteTestId, 'ERROR', `Fallo de red al intentar conectar con Netlify: ${err.message}`, null, true);
                        unsubscribe();
                        resolve();
                    });
                });
            });

            // Esperamos a que TODAS las promesas (los 10 nodos) terminen de calcularse en el fondo
            await Promise.all(promesas);

            btn.innerHTML = '<span class="material-symbols-rounded">rocket_launch</span> Ejecutar Acid Test (10 Nodos)';
            btn.disabled = false;
        }
    </script>
