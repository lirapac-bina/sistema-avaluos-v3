<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión - Ing. Leezar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { leezar: { 500: '#0d9488', 600: '#0f766e' } } 
                } 
            } 
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="js/layout.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilos para cabeceras ordenables */
        th[onclick] { cursor: pointer; user-select: none; transition: background-color 0.2s; }
        th[onclick]:hover { background-color: rgba(13, 148, 136, 0.05); color: #0d9488; }
        .dark th[onclick]:hover { background-color: rgba(13, 148, 136, 0.2); color: #2dd4bf; }
        
        /* Select deshabilitado (cuando ya está asignado) */
        select:disabled { 
            background-color: #f3f4f6; color: #64748b; 
            border-color: transparent; cursor: not-allowed; appearance: none; text-align: center; font-weight: 800;
        }
        .dark select:disabled { background-color: #1e293b; color: #94a3b8; }
        
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    
    <main class="w-full p-6 transition-all duration-300">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">Gestión de Expedientes</h1>
                <p class="text-slate-400 dark:text-slate-500 text-sm font-medium mt-1">
                    <span class="flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Base de Datos en Tiempo Real (Avalúos)
                    </span>
                </p>
            </div>
            
            <a href="nuevo-expediente.html" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-teal-200/50 dark:shadow-none flex items-center gap-2 transition-all transform hover:-translate-y-0.5 group">
                <span class="material-symbols-rounded group-hover:rotate-90 transition-transform">add_circle</span> 
                Nuevo Expediente
            </a>
        </header>

        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden fade-in w-full">
            
            <div class="p-5 border-b border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col md:flex-row gap-4 justify-between items-center">
                
                <div class="relative w-full md:w-96 group">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-teal-500 transition-colors">
                        <span class="material-symbols-rounded">search</span>
                    </span>
                    <input type="text" id="search-input" onkeyup="filtrarTabla()" placeholder="Buscar cliente, folio, capturista, visitador, dibujante..." 
                        class="pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl w-full focus:ring-2 focus:ring-teal-500 focus:bg-white dark:focus:bg-slate-800 transition-all outline-none text-sm font-medium dark:text-white placeholder-slate-400">
                </div>
                
                <div class="flex gap-3 w-full md:w-auto items-center flex-wrap">
                    
                    <div class="flex items-center gap-2 mr-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Ver:</span>
                        <select id="rows-per-page" onchange="cambiarPaginacion()" class="bg-transparent text-slate-600 dark:text-slate-300 text-sm py-2 font-bold focus:outline-none cursor-pointer">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                        </select>
                    </div>

                    <select id="filter-status" onchange="filtrarTabla()" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-teal-500 outline-none cursor-pointer font-bold w-full md:w-auto">
                        <option value="">Todos los Estatus</option>
                        <option value="ACTIVO">Activos</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="REVISION">En Revisión</option>
                        <option value="COMPLETADO">Completados</option>
                    </select>

                    <button onclick="cargarExpedientes()" class="text-teal-600 dark:text-teal-400 hover:text-teal-800 dark:hover:text-teal-200 font-bold text-sm flex items-center gap-1 transition-colors px-3 py-2 rounded-lg hover:bg-teal-50 dark:hover:bg-teal-900/30" title="Recargar tabla">
                        <span class="material-symbols-rounded">refresh</span>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse" id="main-table">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 text-[10px] uppercase text-slate-500 dark:text-slate-400 font-extrabold tracking-wider whitespace-nowrap">
                            <th class="px-4 py-4" onclick="ordenarTabla('cliente')">Cliente <span class="align-middle text-lg opacity-30">↕</span></th>
                            <th class="px-4 py-4 text-center" onclick="ordenarTabla('tramite')">Trámite <span class="align-middle text-lg opacity-30">↕</span></th>
                            <th class="px-4 py-4 text-center" onclick="ordenarTabla('timestamp')">Fecha <span class="align-middle text-lg opacity-30">↕</span></th>
                            
                            <th class="px-2 py-4 text-center text-blue-600 dark:text-blue-400 min-w-[110px]">Captura</th>
                            <th class="px-2 py-4 text-center text-indigo-600 dark:text-indigo-400 min-w-[110px]">Visita</th>
                            <th class="px-2 py-4 text-center text-purple-600 dark:text-purple-400 min-w-[110px]">Dibujo</th>
                            
                            <th class="px-4 py-4 text-center" onclick="ordenarTabla('status')">Estatus <span class="align-middle text-lg opacity-30">↕</span></th>
                            <th class="px-4 py-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="bg-white dark:bg-slate-800 divide-y divide-slate-100 dark:divide-slate-700 text-sm text-slate-600 dark:text-slate-300 font-medium">
                        <tr>
                            <td colspan="8" class="text-center py-16">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <div class="animate-spin rounded-full h-8 w-8 border-4 border-slate-100 border-t-teal-500"></div>
                                    <span class="text-slate-400 text-xs font-bold uppercase tracking-wide">Conectando con el Servidor...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50 text-xs text-slate-400 dark:text-slate-500 flex flex-col md:flex-row justify-between items-center gap-4 px-6">
                <span id="total-records" class="font-medium">Cargando registros...</span>
                
                <div class="flex items-center gap-2">
                    <button onclick="cambiarPagina(-1)" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 font-bold transition-colors shadow-sm text-slate-600 dark:text-slate-300 disabled:opacity-50" id="btn-prev">
                        Anterior
                    </button>
                    <span id="page-indicator" class="font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 px-4 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 shadow-sm">
                        1
                    </span>
                    <button onclick="cambiarPagina(1)" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 font-bold transition-colors shadow-sm text-slate-600 dark:text-slate-300 disabled:opacity-50" id="btn-next">
                        Siguiente
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- VARIABLES GLOBALES DEL SISTEMA ---
        let dbExpedientes = []; 
        let datosFiltrados = [];
        let currentPage = 1;
        let rowsPerPage = 25;
        let sortDirection = -1;

        // --- EQUIPO DE CAPTURISTAS ---
        const equipo = ['Sin Asignar', 'Ana', 'Luis', 'Carlos', 'Sofía', 'Pamela', 'Ing. Leezar', 'Dan Gil'];

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            cargarExpedientes();
        });

        // --- 1. CARGA DE DATOS INTELIGENTE ---
        async function cargarExpedientes() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-16"><div class="flex flex-col items-center gap-2"><span class="material-symbols-rounded animate-spin text-3xl text-teal-500">sync</span><span class="text-slate-400 text-sm font-bold">Obteniendo datos de Firebase...</span></div></td></tr>`;

            try {
                const response = await fetch('/.netlify/functions/get-expedientes');
                if (!response.ok) throw new Error(`Error ${response.status}`);
                const data = await response.json();
                
                dbExpedientes = data.map(doc => {
                    let fechaObj = null;
                    let rawDate = doc.fechaCreacion || doc.fecha;

                    // Lógica de Fechas Robusta
                    if (rawDate) {
                        if (rawDate._seconds) { // Timestamp Firestore
                            fechaObj = new Date(rawDate._seconds * 1000);
                        } else if (typeof rawDate === 'string' && rawDate.includes('T')) { // ISO String
                            fechaObj = new Date(rawDate);
                        } else if (typeof rawDate === 'string' && rawDate.includes('/')) { // String Viejo
                            const parts = rawDate.split('/');
                            if(parts.length === 3) fechaObj = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                        }
                    }

                    const timestamp = (fechaObj && !isNaN(fechaObj.getTime())) ? fechaObj.getTime() : 0;
                    const fechaDisplay = (timestamp > 0) 
                        ? fechaObj.toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) 
                        : '<span class="text-slate-300 italic">Pendiente</span>';

                    return {
                        id: doc.id || '---',
                        cliente: (doc.cliente || doc.nombre || 'Sin Nombre').toUpperCase(),
                        tramite: (doc.tramite || doc.tipoTramite || 'General').toUpperCase(),
                        timestamp: timestamp,
                        fechaDisplay: fechaDisplay,
                        status: (doc.status || doc.estatus || 'PENDIENTE').toUpperCase(),
                        
                        // LECTURA DE LOS 3 ROLES
                        capturista: doc.capturista || null,
                        visitador: doc.visitador || null,
                        dibujante: doc.dibujante || null
                    };
                });

                dbExpedientes.sort((a, b) => b.timestamp - a.timestamp);
                datosFiltrados = [...dbExpedientes]; 
                actualizarTabla();

            } catch (error) {
                console.error("Error crítico:", error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-red-500">Error al cargar: ${error.message}</td></tr>`;
            }
        }

        // --- 2. ASIGNAR COLABORADOR ---
        async function asignar(id, rol, selectElement) {
            const colaborador = selectElement.value;
            const original = selectElement.getAttribute('data-original');

            if(!colaborador || colaborador === 'Sin Asignar') return;

            if(!confirm(`¿Confirmar asignación de ${colaborador} como ${rol}?`)) {
                selectElement.value = original || ""; 
                return;
            }

            selectElement.disabled = true; // Bloqueo visual

            try {
                // LLAMADA AL BACKEND "ASSIGN-COLABORADOR"
                const res = await fetch('/.netlify/functions/assign-colaborador', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expedienteId: id, colaborador: colaborador, rol: rol })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Error en servidor');
                }
                
                // Éxito: Actualizar modelo local
                const exp = dbExpedientes.find(e => e.id === id);
                if(exp) exp[rol] = colaborador;
                
                actualizarTabla(); // Refrescar

            } catch (error) {
                alert("Error: " + error.message);
                selectElement.disabled = false;
                selectElement.value = original || "";
            }
        }

        // --- GENERADOR DE SELECTORES ---
        function generarSelector(id, rol, valorActual) {
            // SI YA TIENE VALOR, SE MUESTRA BLOQUEADO
            if (valorActual && valorActual !== 'Sin Asignar') {
                return `<div class="font-bold text-[9px] bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 w-28 mx-auto truncate text-center cursor-not-allowed uppercase" title="${valorActual}">
                    ${valorActual}
                </div>`;
            }

            // SI NO, SE MUESTRA EL SELECTOR
            let opts = `<option value="">Asignar...</option>`;
            equipo.forEach(p => opts += `<option value="${p}">${p}</option>`);
            
            return `<select onchange="asignar('${id}', '${rol}', this)" data-original="" 
                class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-[10px] rounded py-1 px-1 w-28 mx-auto focus:ring-2 focus:ring-teal-500 outline-none font-bold text-slate-500 cursor-pointer hover:border-teal-400 transition-colors uppercase">
                ${opts}
            </select>`;
        }

        // --- 3. FILTRADO (SUPER BUSCADOR) ---
        function filtrarTabla() {
            const texto = document.getElementById('search-input').value.toUpperCase();
            const statusFilter = document.getElementById('filter-status').value;

            datosFiltrados = dbExpedientes.filter(e => {
                // BUSQUEDA EXTENDIDA EN TODAS LAS COLUMNAS RELEVANTES
                // Concatemos todo en un string gigante para buscar de una vez
                const dataString = `
                    ${e.cliente} 
                    ${e.id} 
                    ${e.capturista || ''} 
                    ${e.visitador || ''} 
                    ${e.dibujante || ''}
                `.toUpperCase();

                const matchText = dataString.includes(texto);
                const matchStatus = statusFilter === "" || e.status === statusFilter;
                
                return matchText && matchStatus;
            });
            
            currentPage = 1; 
            actualizarTabla();
        }

        // --- 4. ORDENAMIENTO ---
        function ordenarTabla(campo) {
            sortDirection *= -1;
            datosFiltrados.sort((a, b) => {
                let valA = a[campo];
                let valB = b[campo];
                if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
                if (valA < valB) return -1 * sortDirection;
                if (valA > valB) return 1 * sortDirection;
                return 0;
            });
            actualizarTabla();
        }

        // --- 5. PAGINACIÓN ---
        function cambiarPaginacion() {
            rowsPerPage = parseInt(document.getElementById('rows-per-page').value);
            currentPage = 1;
            actualizarTabla();
        }

        function cambiarPagina(direction) {
            const totalPages = Math.ceil(datosFiltrados.length / rowsPerPage);
            const newPage = currentPage + direction;
            if (newPage > 0 && newPage <= totalPages) {
                currentPage = newPage;
                actualizarTabla();
            }
        }

        // --- 6. RENDERIZADO DE TABLA ---
        function actualizarTabla() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginaDatos = datosFiltrados.slice(start, end);
            const totalDocs = datosFiltrados.length;
            const totalPages = Math.ceil(totalDocs / rowsPerPage) || 1;

            document.getElementById('total-records').innerHTML = `<strong>${totalDocs}</strong> registros encontrados &bull; Mostrando ${start + 1} a ${Math.min(end, totalDocs)}`;
            document.getElementById('page-indicator').textContent = `${currentPage} / ${totalPages}`;
            
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = currentPage === totalPages;
            document.getElementById('btn-prev').classList.toggle('opacity-50', currentPage === 1);
            document.getElementById('btn-next').classList.toggle('opacity-50', currentPage === totalPages);

            if(paginaDatos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-16 text-slate-400 italic bg-slate-50/50 dark:bg-slate-800/50">No se encontraron expedientes con estos filtros.</td></tr>`;
                return;
            }

            paginaDatos.forEach(exp => {
                let badgeClass = '';
                if(exp.status === 'ACTIVO' || exp.status === 'PENDIENTE') badgeClass = 'bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-900/30 dark:text-blue-300';
                else if(exp.status.includes('REVISI')) badgeClass = 'bg-orange-50 text-orange-700 border border-orange-200 dark:bg-orange-900/30 dark:text-orange-300';
                else if(exp.status.includes('COMPLETADO') || exp.status.includes('VALIDA')) badgeClass = 'bg-green-50 text-green-700 border border-green-200 dark:bg-green-900/30 dark:text-green-300';
                else badgeClass = 'bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-800 dark:text-slate-400';

                const row = `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors border-b border-slate-100 dark:border-slate-700 last:border-0 group">
                        
                        <td class="px-4 py-3 font-bold text-slate-700 dark:text-slate-200 text-xs uppercase truncate max-w-[200px]" title="${exp.cliente}">
                            ${exp.cliente}
                        </td>
                        
                        <td class="px-4 py-3 text-center">
                            <span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-[9px] font-bold uppercase border border-slate-200 dark:border-slate-600">
                                ${exp.tramite}
                            </span>
                        </td>
                        
                        <td class="px-4 py-3 text-center text-[10px] text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap">
                            ${exp.fechaDisplay}
                        </td>
                        
                        <td class="px-2 py-3 text-center">${generarSelector(exp.id, 'capturista', exp.capturista)}</td>
                        <td class="px-2 py-3 text-center">${generarSelector(exp.id, 'visitador', exp.visitador)}</td>
                        <td class="px-2 py-3 text-center">${generarSelector(exp.id, 'dibujante', exp.dibujante)}</td>

                        <td class="px-4 py-3 text-center">
                            <span class="${badgeClass} border text-[9px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wide shadow-sm">
                                ${exp.status}
                            </span>
                        </td>
                        
                        <td class="px-4 py-3 text-right flex justify-end gap-1">
                            <button onclick="window.open('portal.html?id=${exp.id}', '_blank')" class="text-slate-400 hover:text-teal-600 p-1.5 rounded-lg hover:bg-slate-100 transition-all" title="Ver Portal">
                                <span class="material-symbols-rounded text-lg">visibility</span>
                            </button>
                            <button onclick="window.location.href='operacion.html?folio=${exp.id}'" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-teal-500 hover:text-teal-600 dark:hover:text-teal-400 px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm transition-all flex items-center gap-1">
                                Trabajar
                            </button>
                        </td>
                    </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }
    </script>
</body>
</html>
